<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="100%" height="100%">
  <defs>
    <style>
      .navy { fill: #143565; }
      .navy-stroke { stroke: #143565; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .white { fill: #ffffff; }
      .white-stroke { stroke: #ffffff; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .esat-text { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; fill: #143565; letter-spacing: 2px; }
      .flow-label { font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════════
       1. ENTRÉE GAUCHE : RÉCUPÉRATION DES DONS DANS LES BENNES DE TRI
       ══════════════════════════════════════════════════════════════════ -->
  <g id="station-benne-collecte">
    <!-- Grande Benne d'Apport / Déchetterie -->
    <path class="navy" d="M 28,126 L 180,126 L 168,248 L 42,248 Z" />
    <rect class="navy" x="20" y="118" width="168" height="12" rx="3" />
    <!-- Rainures verticales de renfort sur la tôle -->
    <line x1="68" y1="130" x2="72" y2="246" stroke="#ffffff" stroke-width="2.5" opacity="0.35" />
    <line x1="104" y1="130" x2="105" y2="246" stroke="#ffffff" stroke-width="2.5" opacity="0.35" />
    <line x1="140" y1="130" x2="138" y2="246" stroke="#ffffff" stroke-width="2.5" opacity="0.35" />

    <!-- Livres visibles à l'ouverture de la benne -->
    <rect class="navy" x="42" y="100" width="34" height="22" rx="2" />
    <line x1="42" y1="108" x2="76" y2="108" stroke="#ffffff" stroke-width="1.8" />
    <rect class="navy" x="80" y="94" width="38" height="26" rx="2" />
    <line x1="80" y1="104" x2="118" y2="104" stroke="#ffffff" stroke-width="1.8" />
    <line x1="80" y1="112" x2="118" y2="112" stroke="#ffffff" stroke-width="1.8" />

    <!-- Cartouche identification Benne de tri -->
    <rect class="white" x="38" y="162" width="130" height="30" rx="5" />
    <text class="flow-label" x="103" y="182" text-anchor="middle" fill="#143565">BENNE DE TRI</text>
    <path d="M 94,152 L 112,152 L 103,142 Z" fill="#ffffff" opacity="0.9" />

    <!-- ── Travailleur 1 : Prélève et décharge les livres de la benne ── -->
    <circle class="navy" cx="224" cy="50" r="17" />
    <path class="navy" d="M 207,48 C 207,33 241,33 241,48 L 251,51 L 241,53 C 233,53 214,53 207,48 Z" />
    <!-- Buste / Tablier de tri -->
    <path class="navy" d="M 206,76 C 206,68 244,68 244,76 L 254,142 L 196,142 Z" />
    <line x1="216" y1="72" x2="218" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="234" y1="72" x2="232" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="212" y1="102" x2="238" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Bras tenant le carton de dons prélevés -->
    <path class="navy-stroke" stroke-width="11" d="M 202,82 C 190,94 192,112 208,126 L 248,126" />
    <path class="navy-stroke" stroke-width="11" d="M 242,82 L 256,108" />
    <!-- Carton porté par travailleur 1 vers la table -->
    <g transform="translate(262, 98) rotate(8)">
      <rect class="navy" x="-22" y="-18" width="44" height="36" rx="3" />
      <line x1="-22" y1="-7" x2="22" y2="-7" stroke="#ffffff" stroke-width="1.8" />
      <path d="M -4,-7 L 4,-7 L 0,0 Z" fill="#ffffff" />
    </g>
    <!-- Jambes travailleur 1 -->
    <path class="navy" d="M 208,142 L 208,236 C 208,242 202,246 196,246 L 222,246 C 222,240 220,234 220,142 Z" />
    <path class="navy" d="M 230,142 L 230,234 C 230,240 228,246 228,246 L 254,246 C 248,246 242,242 242,236 L 242,142 Z" />
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       2. POSTE CENTRE : ATELIER DE TRI & CONTRÔLE MINUTIEUX PAR L'ESAT
       ══════════════════════════════════════════════════════════════════ -->
  <g id="station-atelier-esat">
    <!-- Enseigne officielle ESAT bien centrée sans chevauchement avec les têtes -->
    <text class="esat-text" x="495" y="30" text-anchor="middle">ESAT</text>
    <text x="495" y="47" text-anchor="middle" font-family="Outfit" font-size="13" font-weight="700" fill="#143565" letter-spacing="1.2px">ATELIER DE TRI</text>

    <!-- Table de tri centrale spacieuse -->
    <rect class="navy" x="382" y="125" width="226" height="15" rx="3" />
    <rect class="navy" x="396" y="140" width="198" height="88" rx="3" />
    <rect class="white" x="404" y="148" width="182" height="74" rx="2" opacity="0.12" />

    <!-- Livres en cours de contrôle qualité sur la table -->
    <!-- Livre ouvert sous les yeux des opérateurs -->
    <path d="M 470,114 Q 482,109 495,116 Q 508,109 520,114 L 520,125 Q 508,120 495,125 Q 482,120 470,125 Z" fill="#ffffff" />
    <line x1="495" y1="116" x2="495" y2="125" stroke="#143565" stroke-width="1.5" />
    <!-- Pile de livres triés -->
    <rect class="navy" x="530" y="94" width="34" height="31" rx="2" />
    <line x1="530" y1="104" x2="564" y2="104" stroke="#ffffff" stroke-width="1.5" />
    <line x1="530" y1="114" x2="564" y2="114" stroke="#ffffff" stroke-width="1.5" />
    <!-- Carton de tri en cours -->
    <rect class="navy" x="430" y="96" width="36" height="29" rx="2" />
    <line x1="430" y1="106" x2="466" y2="106" stroke="#ffffff" stroke-width="1.5" />

    <!-- ── Travailleur 2 (Centre-Gauche, penché vers le livre ouvert) ── -->
    <circle class="navy" cx="370" cy="52" r="17" />
    <path class="navy" d="M 353,50 C 353,35 387,35 387,50 L 398,53 L 388,55 C 382,55 362,55 353,50 Z" />
    <path class="navy" d="M 350,75 C 362,68 384,74 388,94 L 380,150 L 352,150 L 342,108 C 340,94 343,81 350,75 Z" />
    <path class="navy-stroke" stroke-width="11" d="M 374,84 C 386,88 398,102 414,116" />
    <path class="navy-stroke" stroke-width="11" d="M 380,102 L 424,120" />
    <!-- Jambes travailleur 2 -->
    <path class="navy" d="M 352,146 L 348,195 C 346,210 338,225 330,240 L 346,242 C 358,228 362,212 364,192 L 368,146 Z" />
    <path class="navy" d="M 366,146 L 372,188 C 376,208 380,224 382,240 L 398,240 C 396,220 390,198 384,166 L 380,146 Z" />

    <!-- ── Travailleur 3 (Centre-Droit, oriente les flux) ── -->
    <circle class="navy" cx="620" cy="52" r="17" />
    <path class="navy" d="M 637,50 C 637,35 603,35 603,50 L 592,53 L 602,55 C 608,55 628,55 637,50 Z" />
    <path class="navy" d="M 640,75 C 628,68 606,74 602,94 L 610,150 L 638,150 L 648,108 C 650,94 647,81 640,75 Z" />
    <path class="navy-stroke" stroke-width="11" d="M 616,84 C 604,88 590,102 576,116" />
    <path class="navy-stroke" stroke-width="11" d="M 608,102 L 568,120" />
    <!-- Jambes travailleur 3 -->
    <path class="navy" d="M 638,146 L 642,195 C 644,210 652,225 660,240 L 644,242 C 632,228 628,212 626,192 L 622,146 Z" />
    <path class="navy" d="M 624,146 L 618,188 C 614,208 610,224 608,240 L 592,240 C 594,220 600,198 606,166 L 610,146 Z" />
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       3. SORTIE DROITE : DOUBLE CIRCUIT (REVENTE SOLIDAIRE & PÂTE À PAPIER)
       ══════════════════════════════════════════════════════════════════ -->
  <g id="station-double-circuit">

    <!-- ── Travailleur 4 : Prépare le carton des livres pour la Revente ── -->
    <circle class="navy" cx="720" cy="50" r="17" />
    <path class="navy" d="M 703,48 C 703,33 737,33 737,48 L 746,51 L 737,53 C 729,53 711,53 703,48 Z" />
    <path class="navy" d="M 702,76 C 702,68 740,68 740,76 L 748,150 L 694,150 Z" />
    <line x1="710" y1="72" x2="712" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="728" y1="72" x2="726" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Bras posant un livre sélectionné dans le bac Revente -->
    <path class="navy-stroke" stroke-width="11" d="M 700,82 C 690,94 694,114 712,124 L 752,124" />
    <path class="navy-stroke" stroke-width="11" d="M 738,82 L 760,110" />
    <!-- Jambes travailleur 4 -->
    <path class="navy" d="M 704,150 L 704,236 C 704,242 698,246 692,246 L 718,246 C 718,240 716,234 716,150 Z" />
    <path class="navy" d="M 726,150 L 726,234 C 726,240 724,246 724,246 L 750,246 C 744,246 738,242 738,236 L 738,150 Z" />

    <!-- ── CIRCUIT A : BAC / CARTON REVENTE SOLIDAIRE ── -->
    <g id="circuit-revente">
      <!-- Carton / Caisse de livres sélectionnés -->
      <path class="navy" d="M 764,142 L 858,142 L 850,248 L 772,248 Z" />
      <rect class="navy" x="758" y="134" width="106" height="11" rx="3" />
      <!-- Piles de beaux livres prêts pour la boutique -->
      <rect class="navy" x="772" y="106" width="78" height="28" rx="3" />
      <line x1="772" y1="115" x2="850" y2="115" stroke="#ffffff" stroke-width="1.8" />
      <line x1="772" y1="124" x2="850" y2="124" stroke="#ffffff" stroke-width="1.8" />
      <!-- Livre vertical posé fièrement -->
      <rect class="navy" x="782" y="80" width="22" height="26" rx="2" />
      <line x1="788" y1="80" x2="788" y2="106" stroke="#ffffff" stroke-width="1.5" />

      <!-- Cartouche REVENTE en blanc sur fond bleu -->
      <rect class="white" x="770" y="168" width="82" height="26" rx="4" />
      <text class="flow-label" x="811" y="186" text-anchor="middle" fill="#143565">REVENTE</text>
      <!-- Sous-titre boutique / réemploi -->
      <text x="811" y="212" text-anchor="middle" font-family="Outfit" font-size="10" font-weight="700" fill="#ffffff" opacity="0.9">BOUTIQUE</text>
    </g>

    <!-- ── CIRCUIT B : BAC RECYCLAGE PÂTE À PAPIER ── -->
    <g id="circuit-pate-a-papier">
      <!-- Grand Bac de matière / Pâte à papier -->
      <path class="navy" d="M 880,140 L 982,140 L 970,248 L 892,248 Z" />
      <rect class="navy" x="872" y="132" width="118" height="11" rx="3" />

      <!-- Matière / Livres usagés débordant dans le bac -->
      <polygon points="886,132 904,106 924,132" class="navy" />
      <polygon points="916,132 940,98 964,132" class="navy" />
      <polygon points="954,132 972,112 984,132" class="navy" />
      <line x1="904" y1="106" x2="922" y2="132" stroke="#ffffff" stroke-width="1.8" />
      <line x1="940" y1="98" x2="956" y2="132" stroke="#ffffff" stroke-width="1.8" />

      <!-- Logo Recyclage officiel universel (Möbius) sur le bac -->
      <g transform="translate(910, 150) scale(0.095)" fill="#ffffff">
        <path d="M174.7 45.1C192.2 17 223 0 256 0s63.8 17 81.3 45.1l38.6 61.7 27-15.6c8.4-4.9 18.9-4.2 26.6 1.7s11.1 15.9 8.6 25.3l-23.4 87.4c-3.4 12.8-16.6 20.4-29.4 17l-87.4-23.4c-9.4-2.5-16.3-10.4-17.6-20s3.4-19.1 11.8-23.9l28.4-16.4L283 79c-5.8-9.3-16-15-27-15s-21.2 5.7-27 15l-17.5 28c-9.2 14.8-28.6 19.5-43.6 10.5c-15.3-9.2-20.2-29.2-10.7-44.4l17.5-28zM429.5 251.9c15-9 34.4-4.3 43.6 10.5l24.4 39.1c9.4 15.1 14.4 32.4 14.6 50.2c.3 53.1-42.7 96.4-95.8 96.4L320 448l0 32c0 9.7-5.8 18.5-14.8 22.2s-19.3 1.7-26.2-5.2l-64-64c-9.4-9.4-9.4-24.6 0-33.9l64-64c6.9-6.9 17.2-8.9 26.2-5.2s14.8 12.5 14.8 22.2l0 32 96.2 0c17.6 0 31.9-14.4 31.8-32c0-5.9-1.7-11.7-4.8-16.7l-24.4-39.1c-9.5-15.2-4.7-35.2 10.7-44.4zm-364.6-31L36 204.2c-8.4-4.9-13.1-14.3-11.8-23.9s8.2-17.5 17.6-20l87.4-23.4c12.8-3.4 26 4.2 29.4 17L182 241.2c2.5 9.4-.9 19.3-8.6 25.3s-18.2 6.6-26.6 1.7l-26.5-15.3L68.8 335.3c-3.1 5-4.8 10.8-4.8 16.7c-.1 17.6 14.2 32 31.8 32l32.2 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-32.2 0C42.7 448-.3 404.8 0 351.6c.1-17.8 5.1-35.1 14.6-50.2l50.3-80.5z"/>
      </g>

      <!-- Cartouche PÂTE À PAPIER en blanc -->
      <rect class="white" x="880" y="210" width="102" height="24" rx="4" />
      <text class="flow-label" x="931" y="227" text-anchor="middle" font-size="11" fill="#143565">PÂTE À PAPIER</text>
    </g>

  </g>
</svg>
